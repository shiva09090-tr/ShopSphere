<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thank You</title>

<style>

body{

font-family:Arial;

background:#f5f5f5;

display:flex;

justify-content:center;

align-items:center;

height:100vh;

}

.box{

background:white;

padding:40px;

border-radius:10px;

text-align:center;

box-shadow:0 0 10px rgba(0,0,0,.2);

width:450px;

}

h1{

color:#25D366;

margin-bottom:20px;

}

button{

padding:12px 25px;

background:#0d6efd;

color:white;

border:none;

cursor:pointer;

font-size:17px;

border-radius:5px;

}

</style>

</head>

<body>

<div class="box">

<h1>🎉 Thank You!</h1>

<p>

Your order request has been sent successfully.

We will contact you on WhatsApp shortly.

</p>

<br>

<button onclick="goHome()">

Continue Shopping

</button>

</div>

<script>

function goHome(){

localStorage.removeItem("cart");

localStorage.removeItem("customer");

window.location.href="index.html";

}

</script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</body>

</html>
