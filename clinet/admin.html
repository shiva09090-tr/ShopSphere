<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<link rel="stylesheet" href="css/admin.css">
</head>
<body>
<button id="logoutBtn">

Logout

</button>
<div class="container">

<h1>ShopSphere Admin Panel</h1>
<div id="notificationBox" class="notification">
    🔔 New Orders :
    <span id="newOrders">0</span>
</div>
<div class="card" onclick="location.href='#productForm'">
    <h2 id="products">0</h2>
    <p>Products</p>
</div>

<div class="card" onclick="location.href='adminOrders.html'">
    <h2 id="orders">0</h2>
    <p>Orders</p>
</div>

<div class="card" onclick="location.href='adminOrders.html?status=Pending'">
    <h2 id="pending">0</h2>
    <p>Pending</p>
</div>

<div class="card" onclick="location.href='adminOrders.html?status=Delivered'">
    <h2 id="delivered">0</h2>
    <p>Delivered</p>
</div>

<div class="card" onclick="location.href='adminOrders.html?status=Cancelled'">
    <h2 id="cancelled">0</h2>
    <p>Cancelled</p>
</div>

<div class="card" onclick="location.href='adminOrders.html'">
    <h2 id="revenue">₹0</h2>
    <p>Revenue</p>
</div>
<div class="lowStockBox">

    <h2>⚠ Low Stock Products</h2>

    <div id="lowStockList">

    </div>

</div>
<h2>📦 Recent Orders</h2>

<table id="recentOrdersTable">

    <thead>

        <tr>

            <th>Customer</th>
            <th>Phone</th>
            <th>Status</th>
            <th>Total</th>
            <th>Date</th>

        </tr>

    </thead>

    <tbody id="recentOrdersBody">

    </tbody>

</table>
<div class="chartBox">

    <h2>Monthly Sales</h2>

    <canvas id="salesChart"></canvas>

</div>
<form id="productForm">

<label for="name">Product Name</label>
<input
 type="text"
 id="name"
 placeholder="Product Name"
 required>

<label for="description">Description</label>
<textarea
 id="description"
 placeholder="Description"
 required></textarea>

<label for="price">Price</label>
<input
 type="number"
 id="price"
 placeholder="Price"
 required>

<label for="category">Category</label>
<input
 type="text"
 id="category"
 placeholder="Category"
 required>

<label for="brand">Brand</label>
<input
 type="text"
 id="brand"
 placeholder="Brand"
 required>

<label for="stock">Stock</label>
<input
 type="number"
 id="stock"
 placeholder="Stock"
 required>

<label for="image">Product Image</label>
<input
 type="file"
 id="image"
 accept="image/*">

<img id="preview" src="" alt="Preview" class="preview-image">

<button type="submit" id="submitBtn">
    Add Product
</button>
<a href="adminOrders.html">

    <button>

        📦 View Orders

    </button>

</a>

</form>

<h2>All Products</h2>

<div id="productList"></div>

</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/adminDashboard.js"></script>
<script src="js/admin.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>
</html>
