<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Visitors - ShopSphere</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            padding: 30px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 30px;
        }

        .back-btn {
            border: none;
            padding: 12px 20px;
            background: #222;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .stat-card h3 {
            color: #666;
            margin-bottom: 10px;
        }

        .stat-card h2 {
            font-size: 32px;
        }

        .recent {
            background: white;
            padding: 25px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .recent h2 {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 14px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #f8f8f8;
        }

        @media (max-width: 800px) {

            .stats {
                grid-template-columns: repeat(2, 1fr);
            }

            body {
                padding: 15px;
            }
        }

        @media (max-width: 500px) {

            .stats {
                grid-template-columns: 1fr;
            }

            .header {
                gap: 15px;
                flex-direction: column;
                align-items: flex-start;
            }

            table {
                font-size: 13px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>👥 Visitor Dashboard</h1>

        <button
            class="back-btn"
            onclick="history.back()"
        >
            ← Back
        </button>

    </div>


    <div class="stats">

        <div class="stat-card">
            <h3>Total Visitors</h3>
            <h2 id="totalVisitors">0</h2>
        </div>

        <div class="stat-card">
            <h3>Today</h3>
            <h2 id="todayVisitors">0</h2>
        </div>

        <div class="stat-card">
            <h3>Last 7 Days</h3>
            <h2 id="last7Days">0</h2>
        </div>

        <div class="stat-card">
            <h3>Last 30 Days</h3>
            <h2 id="last30Days">0</h2>
        </div>

    </div>


    <div class="recent">

        <h2>Recent Visitors</h2>

        <table>

            <thead>

                <tr>
                    <th>#</th>
                    <th>Visitor ID</th>
                    <th>First Visit</th>
                    <th>Last Visit</th>
                </tr>

            </thead>

            <tbody id="visitorTable">

                <tr>
                    <td colspan="4">
                        Loading...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>


<script>

const API = "https://shopsphere-sedh.onrender.com/api/visitors";


async function loadVisitorStats() {

    try {

        const response =
            await fetch(
                `${API}/stats`
            );

        const data =
            await response.json();

        console.log(
            "Visitor Stats:",
            data
        );

        if (!data.success) {
            throw new Error(
                data.message ||
                "Unable to load stats"
            );
        }

        document.getElementById(
            "totalVisitors"
        ).textContent =
            data.totalVisitors;

        document.getElementById(
            "todayVisitors"
        ).textContent =
            data.todayVisitors;

        document.getElementById(
            "last7Days"
        ).textContent =
            data.last7Days;

        document.getElementById(
            "last30Days"
        ).textContent =
            data.last30Days;

    } catch (error) {

        console.error(
            "Visitor Stats Error:",
            error
        );

    }

}


async function loadRecentVisitors() {

    try {

        const response =
            await fetch(
                `${API}/recent`
            );

        const result =
            await response.json();

        console.log(
            "Recent Visitors:",
            result
        );

        const table =
            document.getElementById(
                "visitorTable"
            );

        table.innerHTML = "";

        if (
            !result.success ||
            !result.data ||
            result.data.length === 0
        ) {

            table.innerHTML = `
                <tr>
                    <td colspan="4">
                        No visitors found
                    </td>
                </tr>
            `;

            return;
        }


        result.data.forEach(
            (visitor, index) => {

                const firstVisit =
                    new Date(
                        visitor.firstVisit
                    ).toLocaleString(
                        "en-IN"
                    );

                const lastVisit =
                    new Date(
                        visitor.lastVisit
                    ).toLocaleString(
                        "en-IN"
                    );


                table.innerHTML += `

                    <tr>

                        <td>
                            ${index + 1}
                        </td>

                        <td>
                            ${visitor.visitorId}
                        </td>

                        <td>
                            ${firstVisit}
                        </td>

                        <td>
                            ${lastVisit}
                        </td>

                    </tr>

                `;

            }
        );

    } catch (error) {

        console.error(
            "Recent Visitors Error:",
            error
        );

    }

}


loadVisitorStats();
loadRecentVisitors();

</script>

</body>
</html>
