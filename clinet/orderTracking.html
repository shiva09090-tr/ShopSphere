<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Track Order - ShopSphere</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {

            font-family: Arial, sans-serif;

            background: #f5f6fa;

            min-height: 100vh;

            padding: 30px;

        }


        .container {

            max-width: 700px;

            margin: auto;

        }


        .box {

            background: white;

            padding: 30px;

            border-radius: 16px;

            box-shadow:
                0 5px 25px
                rgba(0,0,0,0.08);

        }


        h1 {

            text-align: center;

            margin-bottom: 10px;

        }


        .subtitle {

            text-align: center;

            color: #666;

            margin-bottom: 30px;

        }


        .form-group {

            margin-bottom: 20px;

        }


        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

        }


        input {

            width: 100%;

            padding: 13px;

            border: 1px solid #ddd;

            border-radius: 8px;

            font-size: 15px;

        }


        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #111;

            color: white;

            font-size: 16px;

            cursor: pointer;

        }


        button:hover {

            background: #333;

        }


        #result {

            margin-top: 30px;

            display: none;

        }


        .order-card {

            border: 1px solid #eee;

            border-radius: 12px;

            padding: 20px;

        }


        .status {

            display: inline-block;

            padding: 8px 14px;

            border-radius: 20px;

            background: #fff3cd;

            color: #856404;

            font-weight: bold;

            margin-bottom: 20px;

        }


        .info {

            margin-bottom: 12px;

        }


        .info strong {

            display: inline-block;

            width: 130px;

        }


        .items {

            margin-top: 20px;

        }


        .item {

            padding: 12px 0;

            border-bottom: 1px solid #eee;

        }


        .error {

            color: red;

            text-align: center;

            margin-top: 15px;

        }


    </style>

</head>


<body>


<div class="container">

    <div class="box">

        <h1>📦 Track Your Order</h1>

        <p class="subtitle">

            Enter your Order ID and phone number

        </p>


        <form id="trackForm">


            <div class="form-group">

                <label>
                    Order ID
                </label>

                <input
                    type="text"
                    id="orderId"
                    placeholder="Enter your Order ID"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Phone Number
                </label>

                <input
                    type="text"
                    id="phone"
                    placeholder="Enter phone number used for order"
                    required
                >

            </div>


            <button type="submit">

                Track Order

            </button>


        </form>


        <div id="errorMessage"
             class="error">
        </div>


        <div id="result">

            <div class="order-card">

                <div
                    id="status"
                    class="status"
                >
                </div>


                <div class="info">

                    <strong>
                        Order ID:
                    </strong>

                    <span id="displayOrderId">
                    </span>

                </div>


                <div class="info">

                    <strong>
                        Customer:
                    </strong>

                    <span id="customerName">
                    </span>

                </div>


                <div class="info">

                    <strong>
                        Phone:
                    </strong>

                    <span id="customerPhone">
                    </span>

                </div>


                <div class="info">

                    <strong>
                        Total:
                    </strong>

                    ₹<span id="totalPrice">
                    </span>

                </div>


                <div class="info">

                    <strong>
                        Payment:
                    </strong>

                    <span id="paymentMethod">
                    </span>

                </div>


                <div class="items">

                    <h3>
                        Products
                    </h3>

                    <div id="itemsList">
                    </div>

                </div>


            </div>

        </div>


    </div>

</div>


<script>


const API =
    "https://shopsphere-sedh.onrender.com/api/orders";



const form =
    document.getElementById(
        "trackForm"
    );



form.addEventListener(
    "submit",
    async (e) => {

        e.preventDefault();


        const orderId =
            document
                .getElementById("orderId")
                .value
                .trim();


        const phone =
            document
                .getElementById("phone")
                .value
                .trim();


        const errorMessage =
            document.getElementById(
                "errorMessage"
            );


        const resultBox =
            document.getElementById(
                "result"
            );


        errorMessage.textContent = "";

        resultBox.style.display =
            "none";


        try {


            const response =
                await fetch(
                    `${API}/track`,
                    {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify({

                                orderId:
                                    orderId,

                                phone:
                                    phone

                            })

                    }
                );


            const data =
                await response.json();


            console.log(
                "Track Order Response:",
                data
            );


            if (!response.ok ||
                !data.success) {

                throw new Error(
                    data.message ||
                    "Order not found"
                );

            }


            const order =
                data.data;


            // =================================
            // DISPLAY ORDER
            // =================================


            document.getElementById(
                "status"
            ).textContent =
                order.status ||
                "Pending";


            document.getElementById(
                "displayOrderId"
            ).textContent =
                order._id;


            document.getElementById(
                "customerName"
            ).textContent =
                order.customerName ||
                "Customer";


            document.getElementById(
                "customerPhone"
            ).textContent =
                order.phone ||
                phone;


            document.getElementById(
                "totalPrice"
            ).textContent =
                order.totalPrice ||
                0;


            document.getElementById(
                "paymentMethod"
            ).textContent =
                order.paymentMethod ||
                "—";


            // =================================
            // PRODUCTS
            // =================================


            const itemsList =
                document.getElementById(
                    "itemsList"
                );


            itemsList.innerHTML = "";


            if (
                order.items &&
                order.items.length
            ) {

                order.items.forEach(
                    (item) => {

                        itemsList.innerHTML += `

                            <div class="item">

                                <strong>
                                    ${item.productName || "Product"}
                                </strong>

                                <br>

                                Quantity:
                                ${item.quantity || 1}

                                <br>

                                Price:
                                ₹${item.price || 0}

                            </div>

                        `;

                    }
                );

            }


            resultBox.style.display =
                "block";


        }

        catch (error) {

            console.error(
                "Track Order Error:",
                error
            );


            errorMessage.textContent =
                error.message ||
                "Unable to track order";

        }

    }
);


</script>


</body>

</html>
