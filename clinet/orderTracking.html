<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Track Order - ShopSphere</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f6fa;
            color: #222;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        /* HEADER */

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 30px;
        }

        .back-btn {
            border: none;
            background: #111;
            color: white;
            padding: 11px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }

        .back-btn:hover {
            background: #333;
        }

        /* CARD */

        .card {
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        /* ORDER HEADER */

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 25px;
        }

        .order-header h2 {
            font-size: 24px;
        }

        .order-id {
            margin-top: 7px;
            color: #777;
            font-size: 14px;
            word-break: break-all;
        }

        /* STATUS */

        .status {
            padding: 9px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            white-space: nowrap;
        }

        .pending {
            background: #fff3cd;
            color: #856404;
        }

        .confirmed {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .processing {
            background: #e0e7ff;
            color: #4338ca;
        }

        .shipped {
            background: #ede9fe;
            color: #6d28d9;
        }

        .out-for-delivery {
            background: #fef3c7;
            color: #92400e;
        }

        .delivered {
            background: #dcfce7;
            color: #166534;
        }

        .cancelled {
            background: #fee2e2;
            color: #b91c1c;
        }

        /* INFO */

        .order-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 35px;
        }

        .info-box {
            background: #f7f7f7;
            padding: 16px;
            border-radius: 12px;
        }

        .info-box small {
            display: block;
            color: #777;
            margin-bottom: 6px;
        }

        .info-box strong {
            font-size: 15px;
        }

        /* TRACKING */

        .tracking-title {
            font-size: 22px;
            margin-bottom: 25px;
        }

        .timeline {
            display: flex;
            justify-content: space-between;
            position: relative;
            margin: 30px 0 45px;
        }

        .timeline::before {
            content: "";
            position: absolute;
            top: 18px;
            left: 4%;
            width: 92%;
            height: 5px;
            background: #ddd;
            z-index: 0;
            border-radius: 10px;
        }

        .progress-line {
            position: absolute;
            top: 18px;
            left: 4%;
            height: 5px;
            background: #22c55e;
            z-index: 1;
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        .timeline-step {
            position: relative;
            z-index: 2;
            text-align: center;
            width: 16%;
        }

        .circle {
            width: 38px;
            height: 38px;
            margin: auto;
            border-radius: 50%;
            background: #ddd;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-weight: bold;
            font-size: 16px;
        }

        .timeline-step.completed .circle {
            background: #22c55e;
        }

        .timeline-step.current .circle {
            background: #2563eb;

            box-shadow:
                0 0 0 6px rgba(37,99,235,0.12);
        }

        .timeline-step.cancelled-step .circle {
            background: #dc2626;
        }

        .timeline-step span {
            display: block;
            margin-top: 10px;
            font-size: 12px;
            color: #777;
        }

        .timeline-step.current span {
            color: #2563eb;
            font-weight: bold;
        }

        /* MESSAGE */

        .current-status {
            background: #f7f7f7;
            border-radius: 12px;
            padding: 18px;
            margin-top: 20px;
            text-align: center;
        }

        .current-status strong {
            font-size: 18px;
        }

        /* ERROR */

        .error {
            background: white;
            padding: 50px;
            text-align: center;
            border-radius: 18px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
        }

        .error h2 {
            margin-bottom: 10px;
        }

        .error p {
            color: #777;
            margin-top: 8px;
        }

        .error button {
            margin-top: 20px;
            padding: 12px 22px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            cursor: pointer;
        }

        /* MOBILE */

        @media(max-width:700px) {

            body {
                padding: 15px;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .card {
                padding: 20px;
            }

            .order-header {
                flex-direction: column;
            }

            .order-info {
                grid-template-columns: 1fr;
            }

            .timeline {
                overflow-x: auto;
                gap: 15px;
                padding-bottom: 10px;
            }

            .timeline-step {
                min-width: 85px;
            }

            .timeline::before,
            .progress-line {
                display: none;
            }

        }

    </style>

</head>

<body>

<div class="container">

    <!-- HEADER -->

    <div class="header">

        <h1>🚚 Track Order</h1>

        <button
            class="back-btn"
            onclick="history.back()"
        >
            ← Back
        </button>

    </div>


    <!-- CONTENT -->

    <div id="trackingContainer">

        <div class="error">

            <h2>⏳ Loading Order...</h2>

            <p>
                Please wait...
            </p>

        </div>

    </div>

</div>


<script>

const API =
    "https://shopsphere-sedh.onrender.com/api/orders/track";


// =====================================================
// GET ORDER DETAILS
// =====================================================

async function loadTracking() {

    const container =
        document.getElementById(
            "trackingContainer"
        );


    // ---------------------------------------------------
    // GET DATA FROM LOCAL STORAGE
    // ---------------------------------------------------

    const orderId =
        localStorage.getItem(
            "trackOrderId"
        );

    const phone =
        localStorage.getItem(
            "trackOrderPhone"
        );


    console.log(
        "Track Order ID:",
        orderId
    );

    console.log(
        "Track Order Phone:",
        phone
    );


    // ---------------------------------------------------
    // CHECK DATA
    // ---------------------------------------------------

    if (!orderId) {

        container.innerHTML = `

            <div class="error">

                <h2>
                    ❌ Order Not Found
                </h2>

                <p>
                    Please open Track Order from My Orders.
                </p>

                <button
                    onclick="
                        window.location.href='myOrders.html'
                    "
                >
                    Go To My Orders
                </button>

            </div>

        `;

        return;

    }


    try {

        // ------------------------------------------------
        // API REQUEST
        // ------------------------------------------------

        const response =
            await fetch(API, {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({

                    orderId: orderId,

                    phone: phone

                })

            });


        const result =
            await response.json();


        console.log(
            "🚚 Track Order Response:",
            result
        );


        // ------------------------------------------------
        // ERROR
        // ------------------------------------------------

        if (
            !response.ok ||
            !result.success
        ) {

            throw new Error(

                result.message ||
                "Unable to load order"

            );

        }


        // ------------------------------------------------
        // ORDER
        // ------------------------------------------------

        const order =
            result.data;


        if (!order) {

            throw new Error(
                "Order not found"
            );

        }


        // ------------------------------------------------
        // STATUS
        // ------------------------------------------------

        const status =
            order.status ||
            "Pending";


        const statusClassName =
            getStatusClass(status);


        // ------------------------------------------------
        // ORDER DATE
        // ------------------------------------------------

        const date =
            order.createdAt
                ?
                new Date(
                    order.createdAt
                ).toLocaleString(
                    "en-IN"
                )
                :
                "—";


        // ------------------------------------------------
        // DELIVERY DATE
        // ------------------------------------------------

        let deliveryDate = "Not Set";


        if (order.deliveryDate) {

            deliveryDate =
                new Date(
                    order.deliveryDate
                ).toLocaleDateString(
                    "en-IN",
                    {
                        day: "2-digit",
                        month: "2-digit",
                        year: "numeric"
                    }
                );

        }


        console.log(
            "📅 Delivery Date:",
            deliveryDate
        );


        // ------------------------------------------------
        // TIMELINE
        // ------------------------------------------------

        const timeline =
            createTimeline(status);


        // ------------------------------------------------
        // DISPLAY
        // ------------------------------------------------

        container.innerHTML = `

            <div class="card">


                <!-- ORDER HEADER -->

                <div class="order-header">

                    <div>

                        <h2>
                            📦 Order
                        </h2>

                        <div class="order-id">

                            Order ID:
                            ${order._id}

                        </div>

                    </div>


                    <span
                        class="status ${statusClassName}"
                    >

                        ${status}

                    </span>

                </div>


                <!-- ORDER INFO -->

                <div class="order-info">


                    <div class="info-box">

                        <small>
                            Customer
                        </small>

                        <strong>
                            ${order.customerName || "—"}
                        </strong>

                    </div>


                    <div class="info-box">

                        <small>
                            Phone
                        </small>

                        <strong>
                            ${order.phone || "—"}
                        </strong>

                    </div>


                    <div class="info-box">

                        <small>
                            Order Date
                        </small>

                        <strong>
                            ${date}
                        </strong>

                    </div>


                    <div class="info-box">

                        <small>
                            Total
                        </small>

                        <strong>
                            ₹${Number(order.totalPrice) || 0}
                        </strong>

                    </div>


                    <!-- DELIVERY DATE -->

                    <div class="info-box">

                        <small>
                            Expected Delivery
                        </small>

                        <strong
                            style="
                                color:#16a34a;
                            "
                        >
                            ${deliveryDate}
                        </strong>

                    </div>


                </div>


                <!-- TRACKING -->

                <h3 class="tracking-title">

                    🚚 Order Tracking

                </h3>


                ${timeline}


                <!-- CURRENT STATUS -->

                <div class="current-status">

                    Current Order Status:

                    <strong>
                        ${status}
                    </strong>

                </div>


            </div>

        `;

    }


    catch(error) {

        console.error(
            "❌ Track Order Error:",
            error
        );


        container.innerHTML = `

            <div class="error">

                <h2>
                    ❌ Unable to Track Order
                </h2>

                <p>
                    ${error.message}
                </p>

                <button
                    onclick="
                        window.location.href='myOrders.html'
                    "
                >
                    ← Back To My Orders
                </button>

            </div>

        `;

    }

}


// =====================================================
// STATUS CLASS
// =====================================================

function getStatusClass(status) {

    switch(status) {

        case "Confirmed":
            return "confirmed";

        case "Processing":
            return "processing";

        case "Shipped":
            return "shipped";

        case "Out for Delivery":
            return "out-for-delivery";

        case "Delivered":
            return "delivered";

        case "Cancelled":
            return "cancelled";

        default:
            return "pending";

    }

}


// =====================================================
// CREATE TIMELINE
// =====================================================

function createTimeline(status) {

    const statuses = [

        "Pending",
        "Confirmed",
        "Processing",
        "Shipped",
        "Out for Delivery",
        "Delivered"

    ];


    // ---------------------------------------------------
    // CANCELLED
    // ---------------------------------------------------

    if (status === "Cancelled") {

        return `

            <div class="timeline">

                <div class="timeline-step completed">

                    <div class="circle">
                        ✓
                    </div>

                    <span>
                        Pending
                    </span>

                </div>


                <div class="timeline-step cancelled-step">

                    <div class="circle">
                        ✕
                    </div>

                    <span>
                        Cancelled
                    </span>

                </div>

            </div>

        `;

    }


    // ---------------------------------------------------
    // CURRENT INDEX
    // ---------------------------------------------------

    let currentIndex =
        statuses.indexOf(status);


    if (currentIndex < 0) {

        currentIndex = 0;

    }


    // ---------------------------------------------------
    // PROGRESS
    // ---------------------------------------------------

    const progress =
        (currentIndex /
        (statuses.length - 1)) *
        92;


    // ---------------------------------------------------
    // TIMELINE
    // ---------------------------------------------------

    return `

        <div class="timeline">

            <div
                class="progress-line"
                style="
                    width:${progress}%;
                "
            ></div>


            ${statuses.map(
                (item, index) => {

                    let className =
                        "timeline-step";


                    if (
                        index <
                        currentIndex
                    ) {

                        className +=
                            " completed";

                    }


                    else if (
                        index ===
                        currentIndex
                    ) {

                        className +=
                            " current";

                    }


                    return `

                        <div
                            class="${className}"
                        >

                            <div class="circle">

                                ${
                                    index <=
                                    currentIndex
                                        ?
                                    "✓"
                                        :
                                    ""
                                }

                            </div>


                            <span>
                                ${item}
                            </span>

                        </div>

                    `;

                }

            ).join("")}


        </div>

    `;

}


// =====================================================
// START
// =====================================================

loadTracking();

</script>

</body>

</html>
