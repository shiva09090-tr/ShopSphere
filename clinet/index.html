<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ShopSphere</title>

<link rel="stylesheet" href="css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<nav>

<div class="logo">

ShopSphere

</div>

<div>

<input
type="text"
placeholder="Search Products..."
id="search">

</div>

<div class="icons">

    <div class="userSection">

    <span id="username"></span>

    <button id="loginBtn">
        Login
    </button>

    <button id="logoutBtn" style="display:none;">
        Logout
    </button>

</div>

    <i class="fa-solid fa-heart"></i>

   <div class="cart-icon" onclick="window.location='cart.html'">

        <i class="fa-solid fa-cart-shopping"></i>

        <span id="cartCount">0</span>

    </div>
    <button id="themeToggle" title="Dark Mode">
    🌙
</button>

</div>

</nav>

<section class="banner">

<h1>Welcome To ShopSphere</h1>

<p>Best Deals Everyday</p>

<button>Shop Now</button>

</section>

<!-- Categories -->

<section class="categories">

    <div class="category">
        📱
        <span>Mobiles</span>
    </div>

    <div class="category">
        💻
        <span>Laptops</span>
    </div>

    <div class="category">
        👟
        <span>Shoes</span>
    </div>

    <div class="category">
        ⌚
        <span>Watches</span>
    </div>

    <div class="category">
        👕
        <span>Fashion</span>
    </div>

    <div class="category">
        🎧
        <span>Accessories</span>
    </div>

</section>

<section class="filter-section">

    <select id="categoryFilter" title="Filter by category">
        <option value="All">All Categories</option>
        <option value="Mobile">Mobile</option>
        <option value="Laptop">Laptop</option>
        <option value="Shoes">Shoes</option>
        <option value="Fashion">Fashion</option>
        <option value="Accessories">Accessories</option>
    </select>

</section>
<div class="filters">

    <input
        type="text"
        id="search"
        placeholder="Search Product">

    <select id="categoryFilterSecondary" title="Filter by category">
        <option value="">All Categories</option>
    </select>

    <input
        type="number"
        id="minPrice"
        placeholder="Min Price">

    <input
        type="number"
        id="maxPrice"
        placeholder="Max Price">

    <select id="sortBy">

        <option value="">Sort By</option>

        <option value="low">Price Low → High</option>

        <option value="high">Price High → Low</option>

        <option value="new">Newest</option>

    </select>

</div>
<h2 class="title">Featured Products</h2>

<div id="products"></div>

<section>

<h2 class="title">

Featured Products

</h2>

<div id="products"></div>

</section>

<script src="js/app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

</body>

</html>
